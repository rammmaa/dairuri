services:
  darori-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: darori
      POSTGRES_USER: darori
      POSTGRES_PASSWORD: darori
    ports:
      - "54320:5432"
    volumes:
      - darori-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darori -d darori"]
      interval: 5s
      timeout: 3s
      retries: 10

  darori-redis:
    image: redis:7-alpine
    ports:
      - "63790:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  darori-postgres-data:
